name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Only one Pages deployment at a time; don't cancel one that's already
# rolling out.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Type check and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # Astro supports even-numbered releases only.
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run check

      - name: Build
        run: pnpm run build

      - name: Als Pages-Artifact ablegen
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  # Deployt nur den main-Branch — Pull Requests bauen und prüfen zwar mit,
  # veröffentlichen aber nicht.
  deploy:
    name: Auf GitHub Pages veröffentlichen
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
